<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nous на телефоне</title>
<!--
  Страница для проверки мобильной вёрстки с компьютера.

  Нужна потому, что на большом экране приложение показывает обычную версию, а
  посмотреть надо телефонную. Здесь оно открыто в окне фиксированного размера —
  ровно такого, какой у настоящего телефона, — поэтому срабатывают те же
  медиазапросы, что и на устройстве.

  Это не часть приложения: отдельный файл рядом, в сборку самого Nous не входит.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 24px 16px 40px;
    background: #10201e;
    color: #d8efec;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 650; }
  p { margin: 0; opacity: 0.65; text-align: center; max-width: 560px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.06);
    color: inherit;
    cursor: pointer;
  }
  button.on { background: #2dd4bf; border-color: #2dd4bf; color: #06302b; font-weight: 650; }
  /* Рамка телефона: тень и скруглённые углы, чтобы сразу было видно границы экрана. */
  .phone {
    border: 10px solid #05100f;
    border-radius: 34px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    overflow: hidden;
    background: #fff;
    flex: 0 0 auto;
  }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
  .size { opacity: 0.5; font-size: 12.5px; }
</style>
</head>
<body>
  <h1>Nous — как на телефоне</h1>
  <p>Окно ниже размером с настоящий телефон, поэтому приложение показывает мобильную вёрстку.
     Кнопками можно переключить модель экрана.</p>
  <div class="bar" id="bar"></div>
  <div class="phone" id="phone"><iframe id="app" src="./" title="Nous"></iframe></div>
  <div class="size" id="size"></div>

<script>
  // Ходовые размеры: от узкого старого андроида до крупного айфона.
  const SIZES = [
    { name: 'iPhone SE', w: 375, h: 667 },
    { name: 'Android', w: 360, h: 800 },
    { name: 'iPhone 12/13', w: 390, h: 844 },
    { name: 'iPhone Pro Max', w: 430, h: 932 },
  ];
  const bar = document.getElementById('bar');
  const phone = document.getElementById('phone');
  const label = document.getElementById('size');

  function apply(i) {
    const s = SIZES[i];
    phone.style.width = s.w + 'px';
    phone.style.height = s.h + 'px';
    label.textContent = s.w + ' × ' + s.h + ' px';
    for (const b of bar.children) b.classList.toggle('on', Number(b.dataset.i) === i);
    try { localStorage.setItem('nous_phone_size', String(i)); } catch (e) { /* приватный режим */ }
  }

  SIZES.forEach((s, i) => {
    const b = document.createElement('button');
    b.textContent = s.name;
    b.dataset.i = String(i);
    b.onclick = () => apply(i);
    bar.appendChild(b);
  });

  let start = 2;
  try { start = Number(localStorage.getItem('nous_phone_size') ?? 2) || 2; } catch (e) { /* ignore */ }
  apply(Math.min(Math.max(start, 0), SIZES.length - 1));
</script>
</body>
</html>
