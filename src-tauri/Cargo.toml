[package]
name = "app"
version = "0.3.0"
description = "Nous — локальный ИИ-помощник для подготовки к ЕГЭ"
authors = ["meelli"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# rustls вместо системного TLS: под Android нет OpenSSL, и сборка на нём падала
# (openssl-sys не находит установку). rustls везёт корневые сертификаты с собой,
# поэтому одинаково работает и в Windows, и на телефоне.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset", "gzip"] }
base64 = "0.22"
futures-util = "0.3"
